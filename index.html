<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://bachi-editor.github.io/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Bachi Editor</title>
    <script>
      // Apply the saved theme + UI language before first paint. Must use the
      // same storage keys the app does (tk-theme / tk-ui-lang, see store.ts).
      try {
        var t = localStorage.getItem('tk-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('tk-ui-lang');
        if (l === 'en' || l === 'ja' || l === 'zh-Hans' || l === 'zh-Hant') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
